version = 1
SPDX-PackageName = "harbour-dashboard"
SPDX-PackageSupplier = "Mirian Margiani <mixosaurus+ichthyo@pm.me>"
SPDX-PackageDownloadLocation = "https://codeberg.org/ichthyosaurus/harbour-dashboard"

[[annotations]]
path = ["translations/**", "TRANSLATORS.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2024 harbour-dashboard translations contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "rpm/harbour-**.spec"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mirian Margiani"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "This file is generated from [this file's name].yaml and shares copyright with it."

[[annotations]]
path = ["icons/**", "qml/images/**", "dist/harbour-**.png", "qml/tiles/**/private/**.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mirian Margiani"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "These files are generated from the sources at icon-src/*."

[[annotations]]
path = "icon-src/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mirian Margiani"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "These files contain proper Dublin Core licensing metadata."

[[annotations]]
path = "qml/weather-icons/**.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright, Federal Office of Meteorology and Climatology MeteoSwiss."
SPDX-License-Identifier = "LicenseRef-MeteoSwiss"
SPDX-FileComment = "These files are included as a cache to reduce load on official servers."

[[annotations]]
path = ["raw/locations/locations-**.json", "qml/js/locations-details/locations-details-**.js", "qml/js/cantons.js", "qml/js/locations-overview.js", "raw/locations-temp/**", "raw/locations-base.js", "raw/locations/locations-**.js", "raw/locations/full-list"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright, Federal Office of Meteorology and Climatology MeteoSwiss."
SPDX-License-Identifier = "LicenseRef-MeteoSwiss"
SPDX-FileComment = "These files are directly taken from the website or converted from data from the website. They should only contain non-copyrightable facts."

[[annotations]]
path = ["qml/js/strings.js", "qml/weather-icons/descriptions", "raw/strings/strings-**.js", "qml/tiles/weather_mch/private/strings/symbols_**.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright, Federal Office of Meteorology and Climatology MeteoSwiss."
SPDX-License-Identifier = "LicenseRef-MeteoSwiss"
SPDX-FileComment = "These files contain weather descriptions, directly taken from the official website, and converted from data from the website."

[[annotations]]
path = ["raw/dummy.js", "raw/forecast.json", "raw/plzDetail.json", "raw/forecast_plzDetail.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright, Federal Office of Meteorology and Climatology MeteoSwiss."
SPDX-License-Identifier = "LicenseRef-MeteoSwiss"
SPDX-FileComment = "These files contain weather forecast data as provided through the website. They are used to document the data format."

[[annotations]]
path = ["qml/py/libs/dateutil/**", "qml/py/libs/dateutil.METADATA"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gustavo Niemeyer, Paul Ganssle"
SPDX-License-Identifier = "BSD-3-Clause AND Apache-2.0"

[[annotations]]
path = ["qml/py/libs/geopy/**", "qml/py/libs/geopy.METADATA"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Kostya Esmukov"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["qml/tiles/day_times/private/astral.py", "qml/tiles/day_times/private/astral.METADATA"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2009-2016 Simon Kennedy"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["qml/tiles/tiles.json", "qml/tiles/weather_mch/NOTES", "setup.cfg"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2024 Mirian Margiani"
SPDX-License-Identifier = "GPL-3.0-or-later"
